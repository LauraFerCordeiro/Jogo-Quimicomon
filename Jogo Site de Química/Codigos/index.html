<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Icon.png" id="iconaba">
    <title>Quimicomon</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <audio autoplay loop>
        <source src="Musica_historica_que_nao_podia_ficar_de_fora.mp3" type="audio/mp3">
    </audio>

    <div class="stars"></div>

    <h1 id="titulo-quimicomon">Quimicomon</h1>

    <div id="imagem">
        <main id="carousel">
            <div class="item"><img src="sprites/NH4OH.png" alt="NH4OH"></div>
            <div class="item"><img src="sprites/CaCO3.png" alt="CaCO3"></div>
            <div class="item"><img src="sprites/HCL03.png" alt="HCL03"></div>
            <div class="item"><img src="sprites/HI.png" alt="HI"></div>
            <div class="item"><img src="sprites/NaNO3.png" alt="NaNO3"></div>
        </main>
    </div>

    <div class="wrap">
        <a href="Fase1.html"><button class="button">START</button></a>
    </div>

    <div id="sobre">
        <h2 id="integrantes">
            Criador:<br>
            GuaraTech<br>
            Parcerias:<br>
            Arthur Gagliardi Azorli<br>
            Andre Duarte Escobal<br>
            Joao Vitor Piovezan<br>
        </h2>
    </div>

    <div id="som">
        <h3>Ative o som para uma melhor experiência!</h3>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      let index = 0;
      setInterval(() => {
        index = (index + 1) % carousel.children.length;
        carousel.style.transform = `translateX(-${index * 25}%)`;
      }, 2000);
    </script>

</body>
</html>
